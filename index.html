<!doctype html>
<html lang="es" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas en Pareja</title>
<meta name="theme-color" content="#f3f4f2">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1f6f5c;--brand-ink:#fff;--bg:color-mix(in srgb,var(--brand) 5%,#f6f5f2);--card:#fff;--ink:#17201d;--muted:#6b7470;--line:color-mix(in srgb,var(--brand) 9%,#e6e3dc);--soft:color-mix(in srgb,var(--brand) 6%,#f1efea);--brand-soft:color-mix(in srgb,var(--brand) 12%,#fff);--int:#e0893b;--int-soft:#fcebdc;--danger:#d0453a;--warn:#e09b1a;--ok:#239a63;--ins:#a9b0ad;--shadow:0 1px 2px rgba(15,25,20,.04),0 8px 24px rgba(15,25,20,.06);--r:22px}
:root[data-mode=dark]{--bg:color-mix(in srgb,var(--brand) 7%,#0d100f);--card:color-mix(in srgb,var(--brand) 6%,#161a19);--ink:#eef2f0;--muted:#9aa39f;--line:color-mix(in srgb,var(--brand) 13%,#272d2b);--soft:color-mix(in srgb,var(--brand) 9%,#1d2220);--brand-soft:color-mix(in srgb,var(--brand) 20%,#161a19);--int:#f0a35e;--int-soft:#3a2a1c;--danger:#ef6b5e;--warn:#f1bd4a;--ok:#4fc28c;--ins:#6f7874;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(118px + env(safe-area-inset-bottom));transition:background-color .45s}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
svg.i.sm{width:18px;height:18px}
/* encabezado */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top{max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 65%,#fff),var(--brand));color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;border:0;box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 35%,transparent);cursor:pointer}
.hello{flex:1;min-width:0;line-height:1.25}
.hello small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.hello b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.iconbtn{position:relative;width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--ins);border:2px solid var(--card)}
.iconbtn.ok .dot{background:var(--ok)}.iconbtn.err .dot{background:var(--danger)}.iconbtn.busy .dot{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.monthbar{max-width:720px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;justify-content:center;gap:4px}
.monthbar.hide{display:none}
.monthbar button{border:0;background:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.monthbar span{font-weight:800;font-size:15px;min-width:160px;text-align:center;text-transform:capitalize;letter-spacing:-.01em}
main{max-width:720px;margin:0 auto;padding:4px 16px}
h2{font-size:24px;letter-spacing:-.025em;margin:6px 0 14px;font-weight:800}
h3{font-size:15px;margin:0;font-weight:800;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g2>*{min-width:0}
.g2 .num{font-size:clamp(15px,4.6vw,22px)!important;overflow-wrap:anywhere}
.num{overflow-wrap:anywhere}
.wf{display:flex;flex-direction:column;gap:12px;margin-top:12px}.wfr{display:flex;gap:10px;align-items:center}.wfr.total{border-top:1px dashed var(--line);padding-top:12px}
.tips{margin:8px 0 0;padding-left:18px;font-size:14px}.tips li{margin:6px 0}
.plan-card{border-left:4px solid var(--lv)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--danger)}.brand{color:var(--brand)}
.big{font-size:clamp(24px,8vw,32px);font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.01em}
.link{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:8px 6px;margin:-8px -6px;font-size:13.5px;min-height:36px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:18px}
.empty svg{margin:0 auto 8px;opacity:.6;width:30px;height:30px}
/* íconos de categoría */
.ico{--c:var(--brand);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.ico.sm{width:34px;height:34px;border-radius:11px}
.ico.sm svg{width:18px;height:18px}
.ico.lg{width:52px;height:52px;border-radius:17px}
/* botones */
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 15px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 84%,#fff),var(--brand));border-color:transparent;color:var(--brand-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.pill.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
/* hero */
.hero{border:0;color:var(--brand-ink);background:radial-gradient(130% 150% at 100% 0%,color-mix(in srgb,var(--brand) 60%,#fff) 0%,var(--brand) 50%,color-mix(in srgb,var(--brand) 66%,#000) 100%);box-shadow:0 16px 36px color-mix(in srgb,var(--brand) 32%,transparent);overflow:hidden;position:relative}
.hero::after{content:'';position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .muted,.hero .tiny,.hero .small{color:color-mix(in srgb,var(--brand-ink) 78%,transparent)}
.hero .big{font-size:clamp(26px,9vw,36px)}
.hero .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:var(--brand-ink)}
:root[data-mode=dark] .hero .btn{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.12)}
.accs{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 2px;scrollbar-width:none;position:relative;z-index:1}
.accs::-webkit-scrollbar{display:none}
.accchip{flex:none;border:0;border-radius:16px;padding:9px 12px;background:rgba(255,255,255,.16);color:var(--brand-ink);text-align:left;cursor:pointer;min-width:118px}
:root[data-mode=dark] .accchip{background:rgba(0,0,0,.14)}
.accchip small{display:block;font-size:11.5px;opacity:.8;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.accchip b{font-size:14.5px;font-variant-numeric:tabular-nums}
.heroact{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.heroact .btn{flex:1}
/* resumen del mes */
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:var(--soft)}
.stat .l{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.statlist{display:flex;flex-direction:column;gap:6px}
.statlist .stat{flex-direction:row;align-items:center;justify-content:space-between;padding:10px 12px}
.stat .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* barras */
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar.lg{height:14px}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c,var(--brand)),color-mix(in srgb,var(--c,var(--brand)) 65%,#fff))}
.bar.warn>span{--c:var(--warn)}.bar.over>span{--c:var(--danger)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--soft);margin:8px 0}
.stack span{height:100%}
.s-cap{background:var(--brand)}.s-int{background:var(--int)}.s-ins{background:var(--ins)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
/* presupuesto */
.brow{display:flex;gap:12px;align-items:center;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.brow:last-child{border-bottom:0}
.brow .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.brow .top2 b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
/* listas */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item .tm{flex:1;min-width:0;display:flex;flex-direction:column}
.item .tm b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tm small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.item .amt small{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.dhead{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 4px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:10px;font-size:15px}
/* gráficos */
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.donutwrap{display:flex;gap:16px;align-items:center}
.donutwrap svg{width:140px;height:140px;flex:none}
.dleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.dleg div{display:flex;align-items:center;gap:8px;font-size:13px}
.dleg i{width:10px;height:10px;border-radius:4px;flex:none}
.dleg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dleg b{font-variant-numeric:tabular-nums}
@media(max-width:380px){.donutwrap svg{width:118px;height:118px}}
.ringwrap{display:flex;align-items:center;gap:16px}
.ringwrap svg{width:118px;height:118px;flex:none}
.ringwrap .grow,.goal .grow,.row .grow{min-width:0}
.dbars{display:flex;align-items:flex-end;gap:2px;height:64px;margin-top:6px}
.dbars span{flex:1;background:color-mix(in srgb,var(--brand) 70%,transparent);border-radius:3px 3px 1px 1px;min-height:2px}
.dbars span.z{background:var(--soft)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.chart .b{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 75%,#fff),var(--brand))}
.chart .b.start{background:color-mix(in srgb,var(--brand) 25%,transparent)}
.chart .cv{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.chart .cl{font-size:11px;color:var(--muted);white-space:nowrap}
.insight{background:var(--brand-soft);border-radius:16px;padding:12px 14px;font-size:14px;margin:12px 0}
.insight.int{background:var(--int-soft)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .n{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.sim{background:var(--soft);border-radius:18px;padding:14px;margin-top:12px}
.simres{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.simres>div{background:var(--card);border-radius:14px;padding:10px 12px}
.simres b{display:block;font-size:17px}
/* pagos fijos */
.sub{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sub:last-child{border-bottom:0}
.sub.off{opacity:.5}
.sub .nm{border:0;background:none;text-align:left;padding:0;cursor:pointer;min-width:0}
.sub .nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .ctl{grid-column:2/4;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inl{border:1px solid transparent;background:var(--soft);border-radius:11px;padding:7px 9px;width:118px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.inl:focus{outline:none;border-color:var(--brand);background:var(--card)}
.inl.date{width:138px;text-align:left;font-weight:600}
/* metas */
.goal{display:flex;gap:14px;align-items:center}
.goal svg{width:76px;height:76px;flex:none}
/* navegación inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.bnav-in{max-width:500px;margin:0 auto;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;box-shadow:0 12px 34px rgba(0,0,0,.13);pointer-events:auto}
.nb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:7px 0;border-radius:18px;cursor:pointer}
.nb.on{color:var(--brand);background:var(--brand-soft)}
.nb.plus{width:58px;height:58px;margin:-26px auto 0;border-radius:20px;background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 72%,#fff),var(--brand) 55%,color-mix(in srgb,var(--brand) 80%,#000));color:var(--brand-ink);box-shadow:0 12px 26px color-mix(in srgb,var(--brand) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.3);padding:0;justify-content:center}
.nb.plus svg{width:28px;height:28px;stroke-width:2.2}
/* hojas */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:28px 28px 0 0;background:var(--card);color:var(--ink);box-shadow:0 -10px 50px rgba(0,0,0,.28)}
@media(min-width:620px){dialog{margin:auto;border-radius:28px}}
dialog::backdrop{background:rgba(8,12,10,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mform{padding:10px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:92vh}
.mform>*{flex-shrink:0}
.pickrow{min-height:48px}
.mform::before{content:'';display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px;flex:none}
.mform h3{font-size:19px;font-weight:800}
.mform label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.mform input,.mform select,.mform textarea{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 13px;font-size:16px;color:var(--ink);font-weight:600;width:100%}
.mform input:focus,.mform select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.mform label.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-weight:600;font-size:14px}
.mform label.check input{width:20px;height:20px;accent-color:var(--brand)}
.amount{font-size:38px!important;font-weight:800!important;text-align:center;letter-spacing:-.03em;padding:14px!important;border-width:2px!important}
.mactions{display:flex;gap:8px;margin-top:4px}
.mactions .btn{flex:1;padding:13px}
.mactions .del{flex:0 0 auto}
.seg{display:flex;background:var(--soft);border-radius:15px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:9px 4px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button:focus{outline:none}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pick button{border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1.15;text-align:center}
.pick button .ico{width:36px;height:36px;border-radius:12px}
.pick button .ico svg{width:20px;height:20px}
.pick button.on{border-color:var(--brand);background:var(--brand-soft)}
.pickrow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pickrow::-webkit-scrollbar{display:none}
.pickrow button{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 11px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.pickrow button .ico{width:28px;height:28px;border-radius:9px}
.pickrow button .ico svg{width:16px;height:16px}
.pickrow button.on{border-color:var(--brand);background:var(--brand-soft)}
.pickrow button.add{color:var(--brand);border-style:dashed}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);text-align:center;line-height:1.2}
.raw{font-size:12px;color:var(--muted);background:var(--soft);border-radius:12px;padding:9px 11px;word-break:break-word}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.colors button.on{box-shadow:0 0 0 2.5px var(--ink)}

<script type="text/plain" id="gscode">/** Finanzas en pareja — sincronización con Google Sheets
 *  Pegar en Extensiones > Apps Script de tu hoja y publicar como Aplicación web.
 */
const DATA_SHEET = '_datos_app';

function doGet(e) { return out_(leer_()); }

/** Ejecuten esta función UNA vez desde el editor (botón ▶ Ejecutar) para crear las pestañas. */
function configurar() {
  const d = leer_();
  vistas_(d.empty ? {} : d);
  SpreadsheetApp.getActive().toast('Pestañas listas. Ahora implementen como Aplicación web.', 'Finanzas en pareja', 8);
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    const body = JSON.parse(e.postData.contents);
    guardar_(body.data);
    vistas_(body.data);
    return out_({ ok: true, at: new Date().toISOString() });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function leer_() {
  const sh = SpreadsheetApp.getActive().getSheetByName(DATA_SHEET);
  if (!sh || sh.getLastRow() === 0) return { empty: true };
  const txt = sh.getRange(1, 1, sh.getLastRow(), 1).getValues().map(r => r[0]).join('');
  return txt ? JSON.parse(txt) : { empty: true };
}

function guardar_(d) {
  const ss = SpreadsheetApp.getActive();
  const sh = ss.getSheetByName(DATA_SHEET) || ss.insertSheet(DATA_SHEET);
  sh.clear();
  const s = JSON.stringify(d);
  const rows = [];
  for (let i = 0; i < s.length; i += 45000) rows.push([s.slice(i, i + 45000)]);
  const rg = sh.getRange(1, 1, rows.length, 1);
  rg.setNumberFormat('@');
  rg.setValues(rows);
  if (!sh.isSheetHidden()) sh.hideSheet();
}

function tabla_(nombre, headers, rows, money) {
  const ss = SpreadsheetApp.getActive();
  const sh = ss.getSheetByName(nombre) || ss.insertSheet(nombre);
  sh.clear();
  const all = [headers].concat(rows);
  sh.getRange(1, 1, all.length, headers.length).setValues(all);
  sh.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#1f6f5c').setFontColor('#ffffff');
  sh.setFrozenRows(1);
  if (rows.length && money) money.forEach(c => sh.getRange(2, c, rows.length, 1).setNumberFormat('"$"#,##0.00'));
  sh.autoResizeColumns(1, headers.length);
}

function vistas_(d) {
  const cat = {}, acc = {}, goal = {}, debt = {};
  (d.categories || []).forEach(c => cat[c.id] = c.name);
  (d.accounts || []).forEach(a => acc[a.id] = a.name);
  (d.goals || []).forEach(g => goal[g.id] = g.name);
  (d.debts || []).forEach(x => debt[x.id] = x.name);
  const tx = (d.transactions || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  // Resumen por mes: para comparar meses y analizar en qué se va la plata
  const meses = {};
  tx.forEach(t => {
    if (!t.date) return;
    const m = t.date.slice(0, 7), v = Number(t.amount || 0);
    const r = meses[m] = meses[m] || { ing: 0, gas: 0, deu: 0, aho: 0, cats: {} };
    if (t.type === 'ingreso') r.ing += v;
    else if (t.type === 'gasto') { r.gas += v; const c = cat[t.categoryId] || 'Otros'; r.cats[c] = (r.cats[c] || 0) + v; }
    else if (t.type === 'deuda') r.deu += v;
    else if (t.type === 'ahorro') r.aho += v;
  });
  const catNames = (d.categories || []).filter(c => c.kind !== 'ingreso').map(c => c.name);
  const ms = Object.keys(meses).sort().reverse();
  const head = ['Mes', 'Ingresos', 'Gastos', 'Pagos a deudas', 'Ahorro', 'Quedó libre'].concat(catNames);
  tabla_('Resumen por mes', head,
    ms.map(m => { const r = meses[m]; return [m, r.ing, r.gas, r.deu, r.aho, r.ing - r.gas - r.deu - r.aho].concat(catNames.map(n => r.cats[n] || 0)); }),
    head.map((_, i) => i + 1).slice(1));
  tabla_('Movimientos', ['Fecha', 'Tipo', 'Monto', 'Categoría', 'Cuenta', 'Hacia', 'Persona', 'Detalle', 'Meta / Deuda'],
    tx.map(t => [t.date, t.kind || t.type, Number(t.amount || 0), cat[t.categoryId] || '', acc[t.accountId] || debt[t.cardDebtId] || '', acc[t.toAccountId] || '', t.person || '', t.note || '', goal[t.goalId] || debt[t.debtId] || '']), [3]);
  tabla_('Cuentas', ['Cuenta', 'Tipo', 'De quién'], (d.accounts || []).map(a => [a.name, a.kind || a.type || '', a.owner || '']));
  tabla_('Pagos fijos', ['Nombre', 'Valor', 'Cada (meses)', 'Próximo cobro', 'Categoría', 'Persona', 'Activo'],
    (d.subscriptions || []).map(s => [s.name, Number(s.amount || 0), s.freq || 1, s.nextDue || '', cat[s.categoryId] || '', s.person || '', s.active === false ? 'No' : 'Sí']), [2]);
  const drows = [];
  (d.debts || []).forEach(x => (x.items || []).forEach(i => drows.push([x.name, i.name, i.rate, Number(i.balance || 0), i.remaining, i.total])));
  tabla_('Deudas', ['Deuda', 'Concepto', 'Tasa E.A. %', 'Saldo capital', 'Cuotas restantes', 'Cuotas totales'], drows, [4]);
  tabla_('Metas', ['Meta', 'Objetivo', 'Ahorrado', 'Fecha límite'],
    (d.goals || []).map(g => [g.name, Number(g.target || 0), tx.filter(t => t.type === 'ahorro' && t.goalId === g.id).reduce((s, t) => s + Number(t.amount || 0), 0), g.deadline || '']), [2, 3]);
  tabla_('Presupuestos', ['Categoría', 'Presupuesto mensual'],
    (d.categories || []).filter(c => c.kind !== 'ingreso').map(c => [c.name, Number(c.budget || 0)]), [2]);
}
</script>

/* =============================== deudas =============================== */
function itemPayment(it){
  if(!it||it.balance<=0.5||it.remaining<=0) return {interest:0,capital:0,pay:0};
  const r=monthlyRate(it.rate), interest=it.balance*r;
  let pay;
  if(it.fixed>0) pay=it.fixed; else if(r===0) pay=it.balance/it.remaining; else pay=it.balance*r/(1-Math.pow(1+r,-it.remaining));
  let capital=Math.max(0,Math.min(it.balance,pay-interest));
  if(it.remaining<=1) capital=it.balance;
  return {interest,capital,pay:interest+capital};
}
function debtNext(d){let interest=0,capital=0;d.items.forEach(it=>{const p=itemPayment(it);interest+=p.interest;capital+=p.capital});const insurance=(capital+interest)>0?(+d.insurance||0):0;return {interest,capital,insurance,total:interest+capital+insurance}}
const debtCapital=d=>d.items.reduce((s,i)=>s+Math.max(0,+i.balance||0),0);
function accrued(d){if(!d.cutDay)return 0;const c=lastOcc(+d.cutDay),n=new Date();n.setHours(0,0,0,0);const days=Math.max(0,Math.round((n-c)/86400000));return debtNext(d).interest*Math.min(days,31)/30}
function termFor(S,r,P){if(P<=0)return 0;if(r===0)return Math.ceil(S/P-1e-9);const x=1-S*r/P;if(x<=0)return 999;return Math.ceil(-Math.log(x)/Math.log(1+r)-1e-9)}
function applyDebtPayment(d,amount,extraId,keepCuota){
  let left=amount;const plans=d.items.map(it=>({it,p:itemPayment(it)}));const nx=debtNext(d);
  const insurance=Math.min(left,nx.insurance);left-=insurance;let interest=0,capital=0;
  plans.forEach(({p})=>{const x=Math.min(left,p.interest);left-=x;interest+=x});
  plans.forEach(({it,p})=>{if(p.capital<=0)return;const x=Math.min(left,p.capital);left-=x;it.balance-=x;capital+=x;if(x>=p.capital-1)it.remaining=Math.max(0,it.remaining-1)});
  if(left>0.5){
    let order=d.items.filter(i=>i.balance>0.5).sort((a,b)=>b.rate-a.rate);
    if(extraId){const t=d.items.find(i=>i.id===extraId);if(t&&t.balance>0.5)order=[t,...order.filter(i=>i!==t)]}
    for(const it of order){
      if(left<=0.5)break;const nextP=itemPayment(it).pay;const x=Math.min(left,it.balance);it.balance-=x;left-=x;capital+=x;
      if(it.balance<=0.5){it.balance=0;it.remaining=0;continue}
      const r=monthlyRate(it.rate);
      if(keepCuota) it.remaining=Math.max(1,termFor(it.balance,r,it.fixed>0?it.fixed:nextP));
      else if(it.fixed>0) it.fixed=r===0?it.balance/it.remaining:it.balance*r/(1-Math.pow(1+r,-it.remaining));
    }
  }
  d.items.forEach(i=>{if(i.balance<0.5){i.balance=0;i.remaining=0}});
  return {interest,capital,insurance,surplus:left};
}
function simulate(d,extra,rollover){
  const items=d.items.filter(i=>i.balance>0.5&&i.remaining>0).map(i=>({rate:+i.rate,r:monthlyRate(i.rate),bal:+i.balance,P:itemPayment(i).pay}));
  const base=items.reduce((s,i)=>s+i.P,0)+extra;let months=0,interest=0,ins=0;
  while(items.some(i=>i.bal>0.5)&&months<600){
    months++;let budget=rollover?base:items.filter(i=>i.bal>0.5).reduce((s,i)=>s+i.P,0)+extra;ins+=+d.insurance||0;
    for(const i of items){if(i.bal<=0.5)continue;const int=i.bal*i.r;interest+=int;const pay=Math.min(i.P,i.bal+int);i.bal=i.bal+int-pay;budget-=pay}
    for(const i of items.filter(i=>i.bal>0.5).sort((a,b)=>b.rate-a.rate)){if(budget<=0.5)break;const x=Math.min(budget,i.bal);i.bal-=x;budget-=x}
  }
  return {months,interest,ins};
}
function cardAdjust(debtId,delta){
  const d=debtById(debtId);if(!d)return;
  let it=d.items.find(i=>i.id===d.id+'-nuevas');
  if(!it){it={id:d.id+'-nuevas',name:'Compras nuevas (1 cuota)',rate:0,balance:0,remaining:0,total:1,fixed:0};d.items.push(it)}
  it.balance=Math.max(0,(+it.balance||0)+delta);it.remaining=it.balance>0.5?1:0;
  d.original=Math.max(0,(+d.original||0)+delta);touch(d);
}

function donut(parts,total,center,sub){
  const R=50,C=2*Math.PI*R;let off=0;
  const segs=total>0?parts.filter(p=>p.v>0).map(p=>{const len=p.v/total*C;const gap=parts.length>1?2:0;const s=`<circle class="seg-anim" r="${R}" cx="64" cy="64" fill="none" stroke="${p.color}" stroke-width="15" stroke-linecap="butt" stroke-dasharray="${Math.max(0.1,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 64 64)"/>`;off+=len;return s}).join(''):'';
  return `<svg viewBox="0 0 128 128"><circle r="${R}" cx="64" cy="64" fill="none" stroke="var(--soft)" stroke-width="15"/>${segs}<text x="64" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)">${sub}</text><text x="64" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="var(--ink)">${center}</text></svg>`;
}
function ring(p,color,center,sub,size=128){
  const R=50,C=2*Math.PI*R,len=Math.min(1,Math.max(0,p))*C;
  return `<svg viewBox="0 0 128 128"><circle r="${R}" cx="64" cy="64" fill="none" stroke="var(--soft)" stroke-width="13"/><circle class="seg-anim" r="${R}" cx="64" cy="64" fill="none" stroke="${color}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 64 64)"/><text x="64" y="${sub?62:70}" text-anchor="middle" font-size="${sub?20:22}" font-weight="800" fill="var(--ink)">${center}</text>${sub?`<text x="64" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)">${sub}</text>`:''}</svg>`;
}
function spendChart(m){
  const [y,mo]=m.split('-').map(Number), days=new Date(y,mo,0).getDate();
  const cm=curMonth(), upto=m===cm?new Date().getDate():(m<cm?days:0);
  const daily=Array(days).fill(0);
  txOfMonth(m).filter(t=>t.type==='gasto').forEach(t=>{const d=+t.date.slice(8)-1;if(d>=0&&d<days)daily[d]+=+t.amount||0});
  let acc=0;const cum=daily.map((v,i)=>(acc+=v));
  const spent=upto?cum[upto-1]:0, budget=totalBudget();
  const max=Math.max(acc,budget,1)*1.08, W=320,H=120,pb=18;
  const X=i=>(i/(days-1))*W, Y=v=>H-pb-(v/max)*(H-pb-8);
  const pts=cum.slice(0,Math.max(1,upto)).map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const line=upto?`M${pts.join(' L')}`:'';
  const area=upto?`${line} L${X(upto-1).toFixed(1)},${H-pb} L0,${H-pb} Z`:'';
  const ideal=budget?`<line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(budget)}" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 4" opacity=".6"/><text x="${W-2}" y="${Y(budget)-6}" text-anchor="end" font-size="9.5" font-weight="700" fill="var(--muted)">Presupuesto ${fmtShort(budget)}</text>`:'';
  const ticks=[1,Math.round(days/2),days].map(d=>`<text x="${X(d-1)}" y="${H-3}" text-anchor="${d===1?'start':d===days?'end':'middle'}" font-size="9.5" fill="var(--muted)">${d}</text>`).join('');
  const dot=upto?`<circle cx="${X(upto-1)}" cy="${Y(spent)}" r="4.5" fill="var(--brand)" stroke="var(--card)" stroke-width="2.5"/>`:'';
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".32"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" y1="${H-pb}" x2="${W}" y2="${H-pb}" stroke="var(--line)"/>${ideal}${area?`<path d="${area}" fill="url(#ga)"/>`:''}${line?`<path class="line-anim" d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`:''}${dot}${ticks}</svg></div>`;
}

function upcoming(days){
  const out=[];
  state.subscriptions.forEach(s=>{if(s.active===false||!s.nextDue)return;const dd=daysUntil(s.nextDue);if(dd<=days)out.push({date:s.nextDue,dd,name:s.name,amount:+s.amount,kind:'sub',id:s.id,ic:catById(s.categoryId)?.ic||'calendar',color:catById(s.categoryId)?.color})});
  state.debts.forEach(d=>{if(!d.dueDay||debtCapital(d)<1)return;const date=nextDayOfMonth(+d.dueDay),dd=daysUntil(date);
    const paid=state.transactions.some(t=>t.type==='deuda'&&t.debtId===d.id&&daysUntil(t.date)<=0&&daysUntil(t.date)>=dd-24);
    if(!paid&&dd<=days)out.push({date,dd,name:d.name,amount:debtNext(d).total,kind:'debt',id:d.id,ic:'card',color:'var(--int)'})});

/* =============================== ¿cómo vamos este mes? =============================== */
function computePlan(){
  const m=curMonth(),[y,mo]=m.split('-').map(Number),days=new Date(y,mo,0).getDate(),day=new Date().getDate(),left=days-day+1,end=`${m}-${pad(days)}`;
  const txs=txOfMonth(m);
  const available=totalAvailable();
  const received=sumAmt(txs.filter(t=>t.type==='ingreso'));
  const incomes=state.plan?.income||{};
  const expected=Object.values(incomes).reduce((s,v)=>s+(+v||0),0);
  const toCome=expected?Math.max(0,expected-received):0;
  const fixed=state.subscriptions.filter(s=>s.active!==false&&s.nextDue&&s.nextDue<=end).map(s=>({name:s.name,amount:+s.amount||0,cat:s.categoryId,date:s.nextDue,id:s.id})).sort((a,b)=>a.date.localeCompare(b.date));
  const debts=state.debts.filter(d=>d.dueDay&&debtCapital(d)>1).map(d=>{
    const due=`${m}-${pad(Math.min(+d.dueDay,days))}`;
    const paid=txs.some(t=>t.type==='deuda'&&t.debtId===d.id)||(d.history||[]).some(h=>h.amount&&h.date&&h.date.startsWith(m));
    return {name:d.name,amount:debtNext(d).total,date:due,paid,id:d.id};
  }).filter(x=>!x.paid);
  const fixedT=fixed.reduce((s,x)=>s+x.amount,0), debtsT=debts.reduce((s,x)=>s+x.amount,0);
  const subCats=new Set(state.subscriptions.filter(s=>s.active!==false).map(s=>s.categoryId));
  const cats=expenseCats().map(c=>{
    const spent=sumAmt(txs.filter(t=>t.type==='gasto'&&t.categoryId===c.id));
    const pend=fixed.filter(f=>f.cat===c.id).reduce((s,f)=>s+f.amount,0);
    const b=+c.budget||0;
    return {c,spent,b,rem:Math.max(0,b-spent-pend),over:b?Math.max(0,spent-b):0,variable:!subCats.has(c.id)};
  });
  const budRem=cats.reduce((s,x)=>s+x.rem,0);
  const savedM=sumAmt(txs.filter(t=>t.type==='ahorro'));
  const saveNeed=state.goals.reduce((s,g)=>{const t=+g.target||0,sv=goalSaved(g.id);if(!g.deadline||t<=sv)return s;const ms=Math.max(1,Math.round(daysUntil(g.deadline)/30.4));return s+(t-sv)/ms},0);
  const saveT=Math.max(0,saveNeed-Math.max(0,savedM));
  const proj=available+toCome-fixedT-debtsT-budRem-saveT;
  const varCats=cats.filter(x=>x.variable&&x.b>0), varB=varCats.reduce((s,x)=>s+x.b,0), varS=varCats.reduce((s,x)=>s+x.spent,0);
  const ideal=varB*(day/days), pace=ideal>0?varS/ideal:0;
  const overCats=cats.filter(x=>x.over>0);
  let level='ok';
  if(proj<0)level='bad';else if(pace>1.15||overCats.length||proj<(expected||available)*0.05)level='warn';
  return {m,days,day,left,available,received,expected,toCome,fixed,fixedT,debts,debtsT,cats,budRem,saveT,savedM,proj,pace,varB,varS,ideal,overCats,level,incomes};
}
const LEVEL={ok:{c:'var(--ok)',t:'Van bien',ic:'check'},warn:{c:'var(--warn)',t:'Van bien, pero con cuidado',ic:'bell'},bad:{c:'var(--danger)',t:'Ojo: no alcanza',ic:'bell'}};

}
function planCard(){

  const perDay=P.proj>0?P.proj/P.left:0;
  return `<section class="card plan-card" data-a="go" data-id="plan" style="--lv:${L.c};cursor:pointer">
    <div class="ch"><h3>¿Cómo vamos este mes?</h3><span class="pill" style="background:color-mix(in srgb,${L.c} 16%,transparent);color:${L.c}">${L.t}</span></div>
    <div class="small">${planHeadline(P)} si pagan lo pendiente y cumplen los presupuestos.</div>

function vPlan(){
  const P=computePlan(),L=LEVEL[P.level],mes=monthLabel(P.m).split(' ')[0];
  const perDay=P.proj>0?P.proj/P.left:0;
  const varLeft=P.varB-P.varS, varPerDay=varLeft>0?varLeft/P.left:0;
  const rows=[
    ['Plata en sus cuentas hoy',P.available,'+','wallet','var(--brand)'],
    ['Ingresos que faltan por llegar',P.toCome,'+','trend','var(--ok)'],
    ['Pagos fijos pendientes',P.fixedT,'-','calendar','#cf3a7b'],
    ['Cuotas de deudas pendientes',P.debtsT,'-','card','var(--int)'],
    ['Lo que falta por gastar del presupuesto',P.budRem,'-','pie','#7453c2'],
    ['Ahorro para sus metas',P.saveT,'-','piggy','#0d8489'],
  ];
  const mx=Math.max(...rows.map(r=>r[1]),Math.abs(P.proj),1);
  // sugerencias
  const tips=[];
  if(P.proj<0){
    const deficit=-P.proj;let rest=deficit;
    const cut=P.cats.filter(x=>x.rem>0&&x.variable).sort((a,b)=>b.rem-a.rem).slice(0,3);
    if(cut.length)tips.push(`Para cuadrar, recorten ${cut.map(x=>{const v=Math.min(x.rem,rest*(x.rem/cut.reduce((s,y)=>s+y.rem,0)));return `<b>${fmt(v)}</b> en ${esc(x.c.name)}`}).join(', ')}.`);
    if(P.saveT>0)tips.push(`O aplacen parte del ahorro de este mes (${fmt(Math.min(P.saveT,deficit))}).`);
    if(!P.expected)tips.push('Si esperan un ingreso este mes, escríbanlo abajo: la proyección todavía no lo cuenta.');
  }else{

    else if(P.ideal>0)tips.push(`El gasto del día a día va ${P.pace<0.9?'por debajo':'en línea con'} lo planeado (${Math.round(P.pace*100)}% del ritmo ideal). 👍`);
    if(P.proj>0&&state.goals.length)tips.push(`Si les sobra, pueden abonar ${fmt(P.proj*0.5)} a una meta y aún les quedan ${fmt(P.proj*0.5)} de colchón.`);
  }
  P.overCats.forEach(x=>tips.push(`${esc(x.c.name)} ya pasó su tope por ${fmt(x.over)}.`));
  if(!P.cats.some(x=>x.b>0))tips.push('Pongan topes en Presupuestos: sin ellos la app no sabe cuánto planean gastar.');
  return `<h2>¿Cómo vamos en ${mes}?</h2>
  <section class="card verdict" style="--lv:${L.c}">
    <div class="row">${ico(L.ic,L.c,'lg')}<div class="grow"><div style="font-weight:800;color:${L.c}">${L.t}</div><div class="tiny muted">Día ${P.day} de ${P.days} · quedan ${P.left} días</div></div></div>

    <div class="big num" style="color:${L.c}">${fmt(Math.abs(P.proj))}</div>
    <div class="small" style="margin-top:4px">si pagan todo lo pendiente y cumplen los presupuestos.</div>
    ${perDay?`<div class="insight" style="margin-bottom:0">Pueden gastar <b>≈ ${fmt(perDay)} por día</b> de más sin afectar el plan.</div>`:''}
  </section>
  <section class="card"><h3>Las cuentas del mes</h3>
    <div class="wf">${rows.map(([l,v,s,ic,c])=>`<div class="wfr">${ico(ic,c,'sm')}<div class="grow"><div class="row" style="justify-content:space-between;gap:8px"><span class="small">${l}</span><b class="num small" style="white-space:nowrap">${s==='-'&&v?'−':s==='+'&&v?'+':''}${fmt(v)}</b></div><div class="bar" style="--c:${c};height:7px;margin-top:5px"><span style="width:${v/mx*100}%"></span></div></div></div>`).join('')}
      <div class="wfr total">${ico(P.proj>=0?'check':'bell',L.c,'sm')}<div class="grow row" style="justify-content:space-between;gap:8px"><b>${P.proj>=0?'Sobrante':'Faltante'}</b><b class="num" style="color:${L.c};white-space:nowrap">${fmt(P.proj)}</b></div></div>
    </div></section>
  ${tips.length?`<section class="card"><h3>Sugerencias</h3><ul class="tips">${tips.map(t=>`<li>${t}</li>`).join('')}</ul></section>`:''}
  <section class="card"><h3>Gasto del día a día</h3>
    <p class="tiny muted" style="margin:4px 0 10px">Categorías sin pagos fijos (comida, transporte, salidas…).</p>
    ${P.varB?`<div class="row" style="justify-content:space-between"><span class="small">Gastado ${fmt(P.varS)} de ${fmt(P.varB)}</span><b class="small">${Math.round(P.varS/P.varB*100)}%</b></div>
    <div class="bar lg ${P.varS>P.varB?'over':P.pace>1.15?'warn':''}" style="margin-top:6px"><span style="width:${Math.min(100,P.varS/P.varB*100)}%"></span></div>
    <div class="tiny muted" style="margin-top:6px">A esta altura del mes lo ideal sería ${fmt(P.ideal)}. ${varPerDay?`Les quedan ≈ ${fmt(varPerDay)} por día.`:''}</div>`:'<div class="small muted">Sin topes en estas categorías todavía.</div>'}
  </section>
  <section class="card"><h3>Lo que falta pagar este mes</h3>
    ${P.fixed.length||P.debts.length?`<div class="list">${[...P.debts.map(d=>({...d,ic:'card',c:'var(--int)',a:'payDebt'})),...P.fixed.map(f=>({...f,ic:catById(f.cat)?.ic||'calendar',c:catById(f.cat)?.color,a:'paySub'}))].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<button class="item" data-a="${x.a}" data-id="${x.id}">${ico(x.ic,x.c,'sm')}<span class="tm"><b>${esc(x.name)}</b><small>${fmtDate(x.date)}${daysUntil(x.date)<0?' · vencido':''}</small></span><span class="amt">${fmt(x.amount)}</span></button>`).join('')}</div>`:empty('Nada pendiente este mes 🎉','check')}
    ${state.subscriptions.some(s=>s.active!==false&&!s.nextDue)?`<p class="tiny muted" style="margin:10px 0 0">Ojo: hay pagos fijos sin fecha y no entran en este cálculo. <button class="link tiny" data-a="go" data-id="fijos">Ponerles fecha</button></p>`:''}
  </section>
  <section class="card"><h3>Ingresos esperados del mes</h3>
    <p class="tiny muted" style="margin:4px 0 10px">Lo que esperan recibir en total este mes (sueldos, etc.). Ya les llegaron ${fmt(P.received)}.</p>
    <div style="display:flex;flex-direction:column;gap:8px">${state.people.map(p=>`<label class="row" style="justify-content:space-between;gap:10px"><span class="small" style="font-weight:700">${esc(p)}</span><input class="inl" style="width:160px" inputmode="decimal" data-ch="planinc" data-id="${esc(p)}" value="${P.incomes[p]?fmtPlain(P.incomes[p]):''}" placeholder="$ 0"></label>`).join('')}</div>
  </section>`;
}

/* =============================== hojas (formularios) =============================== */
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`;
const personSel=(sel,name='person')=>`<select name="${name}">${[...state.people,'Ambos'].map(p=>opt(p,p,sel)).join('')}</select>`;
const accOptions=(sel,exclude)=>state.accounts.filter(a=>a.id!==exclude).map(a=>opt(a.id,a.name+(a.owner&&a.owner!=='Ambos'?` (${a.owner})`:''),sel)).join('');
const dlg=$('#dlg');
function modal(html,onSubmit,opts={}){
  dlg.innerHTML=`<form class="mform" novalidate>${html}<div class="mactions">${opts.del?`<button type="button" class="btn danger del" data-x="del">${opts.delLabel||'Eliminar'}</button>`:''}<button type="button" class="btn" data-x="close">${opts.noSubmit?'Cerrar':'Cancelar'}</button>${opts.noSubmit?'':`<button type="submit" class="btn primary">${opts.submit||'Guardar'}</button>`}</div></form>`;
  const f=dlg.querySelector('form');
  f.addEventListener('submit',e=>{e.preventDefault();if(onSubmit(f)!==false){dlg.close();commit()}});
  f.querySelector('[data-x=close]').onclick=()=>dlg.close();
  if(opts.del)f.querySelector('[data-x=del]').onclick=()=>{if(confirm(opts.delMsg||'¿Eliminar?')){opts.del();dlg.close();commit()}};
  f.querySelectorAll('.seg[data-seg]').forEach(seg=>seg.addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));f.elements[seg.dataset.seg].value=b.dataset.v;opts.onSeg&&opts.onSeg(f,b.dataset.v,seg.dataset.seg)}));
  f.querySelectorAll('[data-pickfor]').forEach(box=>box.addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;if(b.dataset.v==='__new'){opts.onNew&&opts.onNew(f,box);return}box.querySelectorAll('button[data-v]').forEach(x=>x.classList.toggle('on',x===b));f.elements[box.dataset.pickfor].value=b.dataset.v;opts.onPick&&opts.onPick(f,box.dataset.pickfor,b.dataset.v)}));
  opts.onOpen&&opts.onOpen(f);
  if(dlg.open)dlg.close();
  dlg.showModal();
  f.querySelectorAll('.pickrow').forEach(r=>{const on=r.querySelector('.on');if(on)r.scrollLeft=Math.max(0,on.offsetLeft-r.offsetLeft-16)});
  const first=f.querySelector('[data-focus]');if(first)setTimeout(()=>{first.focus();if(first.select)first.select()},120);
}
const val=(f,n)=>f.elements[n]?.value??'';
const catPick=(sel,kind='gasto')=>`<input type="hidden" name="categoryId" value="${esc(sel||'')}"><div class="pick" data-pickfor="categoryId">${state.categories.filter(c=>(c.kind||'gasto')===kind).map(c=>`<button type="button" data-v="${c.id}" class="${c.id===sel?'on':''}">${ico(c.ic,c.color)}${esc(shortName(c.name))}</button>`).join('')}</div>`;
const shortName=n=>{const w=n.split(' ').filter(x=>!['y','de','del','la','el'].includes(x.toLowerCase()));return w.slice(0,2).join(' ')};
function sourcePick(name,sel,withCards){
  const items=state.accounts.map(a=>({v:a.id,l:a.name,ic:accIcon(a),c:a.color}));
  if(withCards)cards().forEach(d=>items.push({v:'card:'+d.id,l:'Tarjeta '+(d.last4?'•• '+d.last4:d.bank||''),ic:'card',c:'#d97945'}));
  if(!items.some(i=>i.v===sel))sel=items[0]?.v||'';
  return `<input type="hidden" name="${name}" value="${esc(sel)}"><div class="pickrow" data-pickfor="${name}">${items.map(i=>`<button type="button" data-v="${esc(i.v)}" class="${i.v===sel?'on':''}">${ico(i.ic,i.c)}${esc(i.l)}</button>`).join('')}<button type="button" class="add" data-v="__new">${svg('plus','i sm')}Cuenta</button></div>`;

function quickNewAccount(f,box){
  const name=prompt('Nombre de la nueva cuenta (ej: Nequi, Daviplata, Bancolombia):');
  if(!name||!name.trim())return;
  const pre=ACC_PRESETS.find(p=>slug(p[0])===slug(name));
  const a=touch({id:'acc-'+uid(),name:name.trim(),kind:pre?pre[1]:'banco',owner:me(),initial:0,color:pre?pre[2]:COLORS[state.accounts.length%COLORS.length],createdAt:now()});
  state.accounts.push(a);persist();
  box.querySelectorAll('button[data-v]').forEach(x=>x.classList.remove('on'));
  box.insertAdjacentHTML('afterbegin',`<button type="button" data-v="${a.id}" class="on">${ico(accIcon(a),a.color)}${esc(a.name)}</button>`);

/* ---- gasto, ingreso y movimientos (también desde notificaciones) ---- */
const ruleId=m=>'rule-'+slug(m).slice(0,40);
const ruleFor=m=>m?state.rules.find(r=>r.id===ruleId(m)):null;
const NTYPES=[['gasto','Gasto'],['ingreso','Ingreso'],['mover','Entre cuentas'],['retiro','Retiro']];
function findDup(amount){
  if(!amount)return null;
  return state.transactions.find(t=>Math.abs(Math.abs(+t.amount||0)-amount)<1&&now()-(t.createdAt||t.updatedAt||0)<20*60000);
}
function notifBlock(data,type){
  const c=data.c;if(!c)return {top:'',bottom:''};
  const dup=!data.pendingId?findDup(c.amount):null;
  const top=`<input type="hidden" name="ntype" value="${type}"><div class="seg" data-seg="ntype">${NTYPES.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===type?'on':''}">${l}</button>`).join('')}</div>`+
    (dup?`<div class="insight int" style="margin:0">Ya hay un movimiento igual hace ${Math.max(1,Math.round((now()-(dup.createdAt||dup.updatedAt))/60000))} min: <b>${esc(txMeta(dup).title)}</b>${dup.person?` (${esc(dup.person)})`:''}. Si es el mismo, no lo registren otra vez.<div style="margin-top:8px"><button type="button" class="btn sm" data-x="same">Es el mismo, no registrar</button></div></div>`:'');
  const unknown=c.app&&!c.acc&&!/wallet|google/i.test(c.app)?`<div class="pill warn" style="white-space:normal">No sé qué cuenta es "${esc(c.app)}". Elíjanla abajo y la recordaré.</div>`:'';
  const bottom=unknown+`<div class="raw">📩 ${c.app?`<b>${esc(c.app)}</b> · `:''}${esc(c.raw)}</div>${c.test?'':`<button type="button" class="btn" data-x="later">${svg('inbox','i sm')}Clasificar después</button>`}`;
  return {top,bottom};
}
function notifWire(f,data){
  const c=data.c;if(!c)return;
  const l=f.querySelector('[data-x=later]');
  if(l)l.onclick=()=>{if(!data.pendingId)state.pending.push(touch({id:uid(),c:{...c,type:f.elements.ntype?.value||c.type},amount:c.amount,merchant:c.note||c.app,date:c.date||todayStr()}));dlg.close();commit();toast('Quedó en "Por clasificar" en Inicio')};
  const s=f.querySelector('[data-x=same]');
  if(s)s.onclick=()=>{if(data.pendingId)remove('pending',data.pendingId);dlg.close();commit();toast('Listo, no se registró dos veces')};
}
const appRuleId=app=>'app-'+slug(app)+'-'+slug(me());
function notifDone(data,accId){
  if(!data.c)return;
  if(data.pendingId)remove('pending',data.pendingId);
  if(data.c.app&&accId&&!String(accId).startsWith('card:')&&!/wallet|google/i.test(data.c.app)){
    const id=appRuleId(data.c.app);let r=state.rules.find(x=>x.id===id);if(!r){r={id};state.rules.push(r)}
    Object.assign(r,{app:data.c.app,accountId:accId,person:me()});touch(r);
  }
}
function reopenAs(f,data,v){dlg.close();openNotif({...data.c,amount:parseMoney(val(f,'amount'))||data.c.amount,note:val(f,'note')||data.c.note},v,data.pendingId)}
function openNotif(c,type,pendingId){
  type=type||c.type;
  const base={c:{...c,type},pendingId,test:c.test};
  if(type==='gasto')return openExpense({...base,amount:c.amount,merchant:c.note,source:c.from||c.acc,date:c.date});
  if(type==='ingreso')return openIncome(null,{...base,amount:c.amount,note:c.note,to:c.to||c.acc,date:c.date,categoryId:c.categoryId});
  return openMove(type==='retiro'?'retiro':'mover',null,{...base,amount:c.amount,note:c.note,from:c.from||c.acc,to:type==='retiro'?'':c.to,date:c.date});
}
function openExpense(data={}){

    <label>¿En qué?<input name="note" value="${esc(merchant)}" placeholder="Ej: D1, Uber, veterinaria"></label>
    <label>Categoría</label>${catPick(cat)}

    <div class="g2"><label>¿Quién?${personSel(tx?tx.person:me())}</label><label>Fecha<input type="date" name="date" value="${tx?tx.date:data.date||todayStr()}"></label></div>
    ${nb.bottom}`,
  f=>{
    const amt=parseMoney(val(f,'amount'));if(amt<=0){alert('Escriban el valor');return false}
    const c=val(f,'categoryId');if(!c){alert('Toquen una categoría');return false}
    if(data.test){toast('Así se verá. Era un ejemplo: no se guardó');return}
    const s=val(f,'source'),cardId=s.startsWith('card:')?s.slice(5):'',note=val(f,'note').trim();
    const o=isNew?{id:uid(),type:'gasto',createdAt:now(),quick:!!data.c}:tx;
    if(!isNew&&tx.cardDebtId)cardAdjust(tx.cardDebtId,-tx.amount);
    if(cardId)cardAdjust(cardId,amt);
    Object.assign(o,{amount:amt,categoryId:c,accountId:cardId?'':s,cardDebtId:cardId,person:val(f,'person'),note,date:val(f,'date')||todayStr()});
    touch(o);if(isNew)state.transactions.push(o);
    state.settings.lastSource=s;
    if(note){let r=state.rules.find(x=>x.id===ruleId(note));if(!r){r={id:ruleId(note)};state.rules.push(r)}Object.assign(r,{merchant:note,categoryId:c,source:s});touch(r)}
    notifDone(data,s);
    toast(isNew?`Gasto guardado en ${catById(c).name} ✓`:'Cambios guardados');
  },{submit:isNew?'Guardar gasto':'Guardar',onNew:quickNewAccount,
    onSeg:(f,v,s)=>{if(s==='ntype')reopenAs(f,data,v)},
    del:tx?()=>{if(tx.cardDebtId)cardAdjust(tx.cardDebtId,-tx.amount);remove('transactions',tx.id)}:data.c?()=>{if(data.pendingId)remove('pending',data.pendingId)}:null,
    delLabel:tx?'Eliminar':'Descartar',delMsg:tx?'¿Eliminar este gasto?':'¿Descartar? No se registra nada.',

function openIncome(tx,data={}){

  modal(`<h3>${data.c?'¿Qué fue este movimiento?':isNew?'Nuevo ingreso':'Editar ingreso'}</h3>${nb.top}
    <input class="amount" name="amount" inputmode="decimal" value="${amount?fmtPlain(amount):''}" placeholder="$ 0" ${amount?'':'data-focus'}>

    <label>Tipo</label>${catPick(tx?.categoryId||data.categoryId||'salario','ingreso')}
    <label>¿A qué cuenta llegó?</label>${sourcePick('source',toAcc,false)}
    <div class="g2"><label>¿De quién?${personSel(tx?tx.person:me())}</label><label>Fecha<input type="date" name="date" value="${tx?tx.date:data.date||todayStr()}"></label></div>
    ${nb.bottom}`,
  f=>{
    const amt=parseMoney(val(f,'amount'));if(amt<=0){alert('Escriban el valor');return false}
    if(data.test){toast('Así se verá. Era un ejemplo: no se guardó');return}

    delLabel:tx?'Eliminar':'Descartar',delMsg:tx?'¿Eliminar este ingreso?':'¿Descartar? No se registra nada.',
    onOpen:f=>notifWire(f,data)});
}
function openMove(mode='mover',tx,data={}){
  const isNew=!tx;
  if(tx)mode=tx.kind||'mover';
  const nb=notifBlock(data,mode==='retiro'?'retiro':'mover');
  const cash=(mode==='retiro'||mode==='consigna')?cashAcc():null;
  let from=tx?tx.accountId:mode==='consigna'?cash.id:(data.from&&!String(data.from).startsWith('card:')?data.from:defAcc());
  let to=tx?tx.toAccountId:mode==='retiro'?cash.id:(data.to||state.accounts.find(a=>a.id!==from&&a.owner===me())?.id||state.accounts.find(a=>a.id!==from)?.id||'');
  const fee=tx?(state.transactions.find(x=>x.feeOf===tx.id)?.amount||0):0;
  const amount=tx?tx.amount:data.amount;
  const title={mover:'Transferir entre cuentas',retiro:'Retirar efectivo',consigna:'Consignar efectivo'}[mode];
  modal(`<h3>${data.c?'¿Qué fue este movimiento?':isNew?title:'Editar movimiento'}</h3>${nb.top}
    <input type="hidden" name="mode" value="${mode}">
    ${isNew&&!data.c?`<div class="seg" data-seg="mode">${[['mover','Transferir'],['retiro','Retirar'],['consigna','Consignar']].map(([v,l])=>`<button type="button" data-v="${v}" class="${mode===v?'on':''}">${l}</button>`).join('')}</div>`:''}
    <input class="amount" name="amount" inputmode="decimal" value="${amount?fmtPlain(amount):''}" placeholder="$ 0" ${amount?'':'data-focus'}>
    <label>${mode==='consigna'?'Sale del efectivo':'Sale de'}</label>${mode==='consigna'?`<input type="hidden" name="from" value="${from}"><div class="raw">${esc(accById(from)?.name)}</div>`:sourcePick('from',from,false)}
    <label>${mode==='retiro'?'Llega al efectivo':'Llega a'}</label>${mode==='retiro'?`<input type="hidden" name="to" value="${to}"><div class="raw">${esc(accById(to)?.name)}</div>`:sourcePick('to',to,false)}
    <label>¿Tuvo algún costo?</label>
    <input type="hidden" name="fee" value="${fee}">
    <div class="pickrow" data-pickfor="fee">${[[0,'Gratis'],[9937,'ACH $9.937'],[2000,'$2.000'],[5000,'$5.000']].map(([v,l])=>`<button type="button" data-v="${v}" class="${+fee===v?'on':''}">${l}</button>`).join('')}</div>
    <div class="g2"><label>Detalle<input name="note" value="${esc(tx?tx.note:data.note||'')}" placeholder="${mode==='mover'?'Ej: para el mercado':'Opcional'}"></label><label>Fecha<input type="date" name="date" value="${tx?tx.date:data.date||todayStr()}"></label></div>
    <label>¿Quién lo hizo?${personSel(tx?tx.person:me())}</label>
    ${nb.bottom}`,
  f=>{
    const amt=parseMoney(val(f,'amount'));if(amt<=0){alert('Escriban el valor');return false}
    const fr=val(f,'from'),too=val(f,'to');
    if(!fr||!too){alert('Elijan las dos cuentas');return false}
    if(fr===too){alert('Elijan dos cuentas distintas');return false}
    if(data.test){toast('Así se verá. Era un ejemplo: no se guardó');return}
    const o=isNew?{id:uid(),type:'transferencia',createdAt:now(),quick:!!data.c}:tx;
    Object.assign(o,{kind:val(f,'mode'),amount:amt,accountId:fr,toAccountId:too,note:val(f,'note').trim(),date:val(f,'date')||todayStr(),person:val(f,'person')});

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const RX_IN=/(recibiste|te (enviaron|consignaron|transfirieron|abonaron|pagaron|giraron)|te llego|te llegaron|te han enviado|ha llegado|llego (dinero|plata|un|una)|recibio|has recibido|abono (a|en) tu|abonamos|consignacion recibida|deposito recibido|ingreso de dinero|dinero recibido)/;
const RX_OUT=/(transferiste|enviaste|envio exitoso|envio realizado|envio de dinero|transferencia (exitosa|realizada|enviada|aprobada)|giro enviado|bre-?b|llave|pasaste)/;
const RX_RET=/(retiro|retiraste|cajero)/;
const RX_REND=/(rendimiento|intereses? (ganados?|abonados?|a tu favor|generados?)|abono (de )?intereses|te pagamos intereses|bolsillo.*(gano|genero)|tu plata (gano|genero))/;
const BANK_WORDS=['nequi','daviplata','bbva','bancolombia','bogota','davivienda','lulo','popular','occidente','villas','colpatria','scotiabank','falabella','itau','pichincha','caja social','movii','dale','rappipay','nu'];
function bankKey(s){const n=' '+norm(s)+' ';return BANK_WORDS.find(w=>w==='nu'?/[\s(]nu[\s)]/.test(n):n.includes(w))||''}

function personIn(name){

    const al=[p,...String(state.aliases?.[p]||'').split(',')].map(x=>norm(x).trim()).filter(x=>x.length>=3);
    if(al.some(a=>{const w=a.split(/\s+/).filter(x=>x.length>=3);return n.includes(a)||(w.length>1&&w.filter(x=>n.includes(x)).length>=2)}))return p;

function whoIn(text){const re=/\b(?:a|para|de|desde)\s+([^\d$,.;:\n]{3,48})/gi;let m;while((m=re.exec(text))){const p=personIn(m[1]);if(p)return p}return ''}

function classify(app,title,text){

function parseAmountLoose(s){
  s=String(s).replace(/[.,]+$/,'');const ld=s.lastIndexOf('.'),lc=s.lastIndexOf(',');
  if(ld>=0&&lc>=0){const dec=ld>lc?'.':',',th=dec==='.'?',':'.';s=s.split(th).join('').replace(dec,'.')}
  else{const sep=ld>=0?'.':lc>=0?',':'';if(sep){const parts=s.split(sep);s=(parts.length===2&&parts[1].length<=2)?parts[0]+'.'+parts[1]:parts.join('')}}
  const n=parseFloat(s);return isNaN(n)?0:n;
}
const GENERIC_TITLE=/google|wallet|^pago|^compra|transfer|env[ií]o|enviaste|recib|listo|exitos|alerta|notific|llegó|lleg[oó]|plata|dinero|movimiento|qr|bbva|nequi|bancolombia|davivienda|daviplata|bogot|banco/i;
function parseNotif(title,text){
  title=(title||'').trim();text=(text||'').trim();const all=title+' '+text;
  const m=all.match(/(?:COP|\$)\s?(\d[\d.,]*)/i)||all.match(/(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?)/);
  const amount=m?parseAmountLoose(m[1]):0;
  let merchant=title;
  if(!merchant||GENERIC_TITLE.test(merchant)){const mm=text.match(/\ben\s+(?!tu\b|su\b|nequi\b|bbva\b|la cuenta)(.+?)(?:\s+con\b|\s+por\b|\s+el\b|\s+desde\b|[,.$]|$)/i);merchant=mm?mm[1].trim():''}
  if(/\d[\d.,]{3,}/.test(merchant)&&!/[a-z]{3}/i.test(merchant))merchant='';
  const l4=all.match(/(?:[•*·xX]+|terminada en|termina en|final)\s*(\d{4})\b/i);
  return {amount,merchant,last4:l4?l4[1]:''};
}

async function handleIncoming(){

  const title=clean(q.get('t')||q.get('title')),text=clean(q.get('x')||q.get('text')),app=clean(q.get('app'));
  history.replaceState(null,'',location.pathname);

document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset?.ch;if(!k)return;
  if(k==='subamt'){const s=subById(t.dataset.id);s.amount=parseMoney(t.value);touch(s);commit();toast('Valor actualizado')}
  else if(k==='subdate'){const s=subById(t.dataset.id);s.nextDue=t.value;touch(s);commit()}
  else if(k==='person'){const i=+t.dataset.id,old=state.people[i],nv=t.value.trim()||old;state.people[i]=nv;if(state.settings.me===old)state.settings.me=nv;state.peopleUpdatedAt=now();commit()}
  else if(k==='planinc'){state.plan.income[t.dataset.id]=parseMoney(t.value);state.planUpdatedAt=now();commit();toast('Ingreso esperado guardado')}
  else if(k==='alias'){state.aliases=state.aliases||{};state.aliases[t.dataset.id]=t.value.trim();state.peopleUpdatedAt=now();commit();toast('Guardado')}
  else if(k==='haptics'){state.settings.haptics=t.checked;persist(false);buzz(12)}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.f.q=e.target.value;clearTimeout(A._q);A._q=setTimeout(()=>{const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)},300)}});
$('#importFile').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  file.text().then(txt=>{try{const d=JSON.parse(txt);if(!d.transactions||!d.debts)throw 0;const keep=state.settings;state=migrate(d);state.settings={...state.settings,sheetsUrl:keep.sheetsUrl,me:keep.me,theme:keep.theme,mode:keep.mode,onboarded:true};commit();toast('Respaldo restaurado ✓')}catch(err){alert('Ese archivo no parece un respaldo válido.')}});
  e.target.value='';
});

/* =============================== Google Sheets =============================== */
const COLLS=['categories','accounts','transactions','subscriptions','debts','goals','rules','pending'];
const syncState={status:'idle',timer:null,busy:false,again:false};
function merge(local,remote){
  const out={...local},del={...(remote.deleted||{})};
  for(const [k,v] of Object.entries(local.deleted||{}))del[k]=Math.max(del[k]||0,v);
  out.deleted=del;
  for(const c of COLLS){const map=new Map();(local[c]||[]).forEach(x=>map.set(x.id,x));(remote[c]||[]).forEach(x=>{const l=map.get(x.id);if(!l||(x.updatedAt||0)>(l.updatedAt||0))map.set(x.id,x)});out[c]=[...map.values()].filter(x=>!(del[x.id]>=(x.updatedAt||0)))}
  if((remote.peopleUpdatedAt||0)>(local.peopleUpdatedAt||0)){out.people=remote.people;out.aliases=remote.aliases||local.aliases;out.peopleUpdatedAt=remote.peopleUpdatedAt}
  if((remote.planUpdatedAt||0)>(local.planUpdatedAt||0)){out.plan=remote.plan;out.planUpdatedAt=remote.planUpdatedAt}
  out.settings=local.settings;return migrate(out);
}
function syncBadge(){
  const b=$('#syncb'),s=state.settings;b.className='iconbtn';b.innerHTML=svg('cloud')+'<span class="dot"></span>';
  if(!s.sheetsUrl)return;
  b.classList.add(syncState.status==='busy'?'busy':syncState.status==='err'?'err':'ok');
}
function scheduleSync(){if(!state.settings.sheetsUrl)return;clearTimeout(syncState.timer);syncState.timer=setTimeout(()=>syncNow(false),2500)}
async function syncNow(manual){
  const url=state.settings.sheetsUrl;if(!url)return;
  if(syncState.busy){syncState.again=true;return}
  syncState.busy=true;syncState.status='busy';syncBadge();
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now());const remote=await r.json();
    if(remote&&!remote.empty&&remote.version)state=merge(state,remote);
    const payload={...state};delete payload.settings;
    const res=await fetch(url,{method:'POST',body:JSON.stringify({data:payload})});const j=await res.json();
    if(!j.ok)throw new Error(j.error||'sin respuesta');
    state.settings.lastSync=Date.now();syncState.status='ok';persist(false);
    if(!dlg.open&&!$('#onb').classList.contains('on')&&document.activeElement?.tagName!=='INPUT')render();else syncBadge();
    if(manual)toast('Sincronizado con Google Sheets ✓');
  }catch(err){console.warn('sync',err);syncState.status='err';syncBadge();if(manual)toast('No se pudo sincronizar. Revisen la URL o el internet.')}
  finally{syncState.busy=false;if(syncState.again){syncState.again=false;scheduleSync()}}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.settings.sheetsUrl)syncNow(false)});

/* =============================== inicio =============================== */
$('#monthbar button[data-id="-1"]').innerHTML=svg('left');
$('#monthbar button[data-id="1"]').innerHTML=svg('right');
applyTheme();
render();
(async()=>{
  if(!state.settings.onboarded){openOnboarding();if(state.settings.sheetsUrl)syncNow(false);return}
  const inc=await handleIncoming();
  if(!inc){const q=new URLSearchParams(location.search);if(q.has('nuevo')){history.replaceState(null,'',location.pathname);openExpense()}if(state.settings.sheetsUrl)syncNow(false)}
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
